<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>温度湿度</title>
  <style>
    :root {
      --ink: #111;
      --paper: #fff;
      --muted: #707070;
      --humidity: rgba(0, 0, 0, .5);
      --line: #d8d8d8;
      --soft: #f6f6f6;
      --offline: rgba(255, 0, 0, .08);
      --offline-line: rgba(255, 0, 0, .2);
      --change-temperature: #b34a36;
      --change-humidity: #2874a6;
      --change-battery: #8b6b18;
      --signal: #267661;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 Arial, "Microsoft YaHei", sans-serif;
    }

    button, input, select { font: inherit; }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 0 28px 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      border-bottom: 1px solid var(--ink);
      padding: 18px 0 14px;
    }

    nav { display: flex; gap: 18px; font-size: 13px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a[aria-current="page"], nav a:hover { color: var(--ink); }

    h2, p { margin: 0; }
    h2 { font-size: 14px; font-weight: 600; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .status-dot.online { background: var(--ink); }
    .status-dot.refreshing {
      background: var(--ink);
      animation: status-pulse .8s ease-in-out infinite;
    }

    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .25; }
    }

    .live {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .primary-reading {
      min-height: 240px;
      padding: 38px 0;
    }

    .primary-reading + .primary-reading {
      border-left: 1px solid var(--line);
      padding-left: 38px;
    }

    .label {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .reading-value {
      font-size: clamp(64px, 9vw, 112px);
      font-weight: 300;
      line-height: .9;
      letter-spacing: -.07em;
    }

    .reading-value small {
      margin-left: 10px;
      font-size: .25em;
      font-weight: 400;
      letter-spacing: 0;
      vertical-align: top;
    }

    .device-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--ink);
      padding: 12px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .battery {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .battery[hidden] { display: none; }

    .battery-icon {
      display: block;
      width: 22px;
      height: 11px;
    }

    .metric-note { margin-top: 5px; color: var(--muted); font-size: 12px; }

    section { border-bottom: 1px solid var(--ink); padding: 30px 0; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .history-head { margin-bottom: 0; }

    .range-buttons { display: flex; gap: 0; }

    .chart-controls { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    .day-navigation { display: inline-grid; grid-template-columns: 40px minmax(118px, auto) 40px; align-items: stretch; }
    .day-navigation[hidden] { display: none; }
    .day-navigation button { padding: 8px 10px; font-size: 18px; line-height: 1; }
    .day-navigation button + button { border-left: 0; }
    .day-navigation button:disabled { cursor: not-allowed; }
    .day-navigation button:disabled:hover { background: var(--paper); color: var(--ink); }
    .day-label {
      display: grid;
      min-width: 118px;
      border: 1px solid var(--ink);
      border-left: 0;
      place-items: center;
      padding: 6px 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .calendar-open { display: inline-flex; align-items: center; gap: 7px; }
    .calendar-open svg { width: 16px; height: 16px; }
    .chart-zoom { display: flex; }
    .chart-zoom button { display: grid; width: 36px; height: 36px; place-items: center; padding: 0; font-size: 18px; line-height: 1; }
    .chart-zoom button + button { border-left: 0; }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 24px; border-top: 2px solid var(--ink); }
    .legend .humidity-line { border-top: 2px solid var(--humidity); }
    .legend .signal-line { border-color: var(--signal); }
    .chart-options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; margin: -8px 0 16px; }
    .chart-options label { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; color: var(--ink); }
    .chart-options input { appearance: auto; width: 15px; height: 15px; min-height: 0; margin: 0; padding: 0; accent-color: var(--ink); cursor: pointer; }
    .chart-options input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .change-legend { flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; }
    .legend [hidden], .change-legend[hidden] { display: none; }
    .change-legend i { width: 0; height: 0; border: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--marker-color); }
    .chart-surface { position: relative; }
    .chart-surface[aria-busy="true"] #chart { opacity: .3; pointer-events: none; }
    .chart-loading { position: absolute; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; background: rgba(255, 255, 255, .5); }
    .chart-loading[hidden] { display: none; }
    .chart-loading::before { content: ""; width: 12px; height: 12px; border: 1px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: chart-spin .8s linear infinite; }
    @keyframes chart-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .chart-loading::before, .status-dot.refreshing { animation: none; }
    }
    .legend .offline-block {
      height: 10px;
      border: 1px solid var(--offline-line);
      background: var(--offline);
    }

    button {
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 8px 13px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }

    button + button { border-left: 0; }
    button.active, button:hover { background: var(--ink); color: var(--paper); }
    button:disabled { cursor: wait; opacity: .5; }

    .chart-wrap {
      position: relative;
      min-height: 340px;
      width: 100%;
      overflow: visible;
      background: var(--paper);
    }

    #chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .chart-tooltip {
      position: absolute;
      z-index: 3;
      top: 10px;
      min-width: 150px;
      border: 1px solid var(--ink);
      padding: 8px 10px;
      background: var(--paper);
      pointer-events: none;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .chart-tooltip[hidden] { display: none; }
    .chart-tooltip.align-left { transform: translateX(-100%); }
    .chart-tooltip strong { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 600; }
    .chart-tooltip span { display: block; color: var(--muted); }
    .chart-tooltip .temperature-value { color: var(--ink); }
    .chart-empty { display: grid; min-height: 340px; place-items: center; color: var(--muted); }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 24px;
    }

    label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; }

    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 8px 10px;
      background: var(--paper);
      color: var(--ink);
    }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { border-bottom: 1px solid var(--line); padding: 13px 8px; text-align: right; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { padding-left: 0; text-align: left; }
    th { color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; }
    td { font-size: 13px; }

    .message { padding: 24px 0; color: var(--muted); text-align: center; }

    #historyPanel[hidden] { display: none; }
    #historyPanel { margin-top: 24px; }
    #historyToggle { padding: 6px 12px; }

    .calendar-dialog {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      border: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
    }
    .calendar-dialog::backdrop { background: rgba(0, 0, 0, .28); }
    .calendar-shell {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      width: min(1440px, 100%);
      height: 100%;
      margin: 0 auto;
      padding: 22px 28px 28px;
    }
    .calendar-header {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 16px;
    }
    .calendar-header h2 { grid-column: 2; text-align: center; font-size: 18px; }
    .calendar-header button { width: 40px; height: 40px; padding: 0; font-size: 20px; }
    .calendar-close { grid-column: 3; }
    .calendar-month-nav {
      display: grid;
      grid-template-columns: 40px minmax(140px, auto) 40px;
      justify-content: center;
      align-items: stretch;
      padding: 18px 0;
    }
    .calendar-month-nav button { padding: 8px; font-size: 18px; line-height: 1; }
    .calendar-month-nav button + button { border-left: 0; }
    .calendar-month-title {
      display: grid;
      border: 1px solid var(--ink);
      border-left: 0;
      place-items: center;
      padding: 7px 16px;
      font-variant-numeric: tabular-nums;
    }
    .calendar-metric-switch { display: flex; justify-content: center; padding-bottom: 14px; }
    .calendar-metric-switch button { min-width: 92px; }
    .calendar-metric-switch button + button { border-left: 0; }
    .calendar-content { min-height: 0; overflow: auto; }
    .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .calendar-weekdays span { padding: 7px 8px; color: var(--muted); font-size: 11px; text-align: center; }
    .calendar-day {
      position: relative;
      min-height: 112px;
      border: 0;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      padding: 9px;
      overflow: hidden;
      text-align: left;
    }
    .calendar-day:nth-child(7n) { border-right: 1px solid var(--line); }
    .calendar-day:nth-last-child(-n + 7) { border-bottom: 1px solid var(--line); }
    .calendar-day + .calendar-day { border-left: 1px solid var(--line); }
    .calendar-day:hover, .calendar-day.selected { background: var(--soft); color: var(--ink); }
    .calendar-day.outside { background: var(--soft); color: #aaa; }
    .calendar-day.future { cursor: not-allowed; color: #bbb; }
    .calendar-day.today .calendar-day-number { border-bottom: 2px solid var(--ink); }
    .calendar-day-number {
      position: absolute;
      z-index: 1;
      top: 8px;
      left: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .calendar-day-reading {
      position: absolute;
      z-index: 1;
      top: 7px;
      right: 9px;
      display: flex;
      gap: 7px;
      color: var(--ink);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .calendar-sparkline { position: absolute; inset: 32px 8px 20px; width: calc(100% - 16px); height: calc(100% - 52px); }
    .calendar-day-range { position: absolute; right: 8px; bottom: 6px; color: var(--muted); font-size: 10px; text-align: right; }
    .calendar-day-range span { display: block; }
    .calendar-loading { grid-column: 1 / -1; padding: 48px; color: var(--muted); text-align: center; }

    @media (max-width: 680px) {
      .page { padding: 0 16px 40px; }
      header { min-height: 48px; padding-top: 14px; }
      .primary-reading { min-height: 150px; padding: 24px 12px 20px 0; }
      .primary-reading + .primary-reading { padding-left: 16px; }
      .reading-value { font-size: clamp(52px, 16vw, 80px); }
      .reading-value small { margin-left: 5px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .chart-controls { width: 100%; justify-content: space-between; }
      .range-buttons { order: 1; width: 100%; }
      .range-buttons button { flex: 1; padding-inline: 7px; }
      .day-navigation, .chart-zoom, .calendar-open { order: 2; }
      .history-head { flex-direction: row; align-items: center; }
      .legend { flex-wrap: wrap; gap: 8px 14px; }
      .filters { grid-template-columns: 1fr; }
      .filters button { width: 100%; }
      .chart-empty { min-height: 220px; }
      .chart-wrap { min-height: 220px; }
      #historyToggle { width: auto; }
      .calendar-shell { padding: 12px 10px 16px; }
      .calendar-header { padding-bottom: 10px; }
      .calendar-month-nav { padding: 10px 0; }
      .calendar-metric-switch { padding-bottom: 10px; }
      .calendar-metric-switch button { min-width: 0; padding-inline: 10px; }
      .calendar-weekdays span { padding-inline: 2px; }
      .calendar-day { min-height: 76px; padding: 6px; }
      .calendar-day-number { top: 5px; left: 6px; }
      .calendar-day-reading { top: 20px; right: auto; left: 6px; flex-direction: column; gap: 0; font-size: 9px; }
      .calendar-sparkline { inset: 42px 4px 4px; width: calc(100% - 8px); height: calc(100% - 46px); }
      .calendar-day-range { display: none; }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <nav aria-label="页面导航">
        <a href="index.php" aria-current="page">实时</a>
        <a href="index.php?action=analytics">分析</a>

  <script>
    const API = {
      latestTemperature: "index.php?action=latest&field=temperature",
      latestHumidity: "index.php?action=latest&field=humidity",
      latestBattery: "index.php?action=latest&field=battery",
      readings: "index.php?action=readings"
    };
    const MODEL_NAMES = {
      MJWSD05MMC: "温湿度计 3",
      MJWSD06MMC: "温湿度计 3 Mini"
    };
    const POLL_INTERVAL = 10000;
    const OFFLINE_THRESHOLD = 2 * 60 * 60 * 1000;
    const MOBILE_QUERY = "(max-width: 680px)";
    const now = new Date();
    const state = {
      chartMode: "range",
      chartHours: 24,
      chartItems: [],
      chartView: null,
      showChanges: false,
      showSignal: false,
      chartLoading: false,
      chartError: "",
      selectedDay: new Date(now.getFullYear(), now.getMonth(), now.getDate()),
      calendarMonth: new Date(now.getFullYear(), now.getMonth(), 1),
      calendarItems: [],
      calendarStats: { temperature: new Map(), humidity: new Map() },
      calendarDevices: 0,
      calendarMetric: "temperature",
      chartRequestId: 0,
      calendarRequestId: 0,
      latestOk: false,
      historyOpen: false,
      refreshing: false,
      secondsLeft: 0
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatNumber(value, digits = 1) {
      return value == null ? "--" : Number(value).toFixed(digits).replace(/\.0$/, "");
    }

    function isMobile() {
      return window.matchMedia(MOBILE_QUERY).matches;
    }

    function formatTime(value, short = false) {
      if (!value) return "--";
      const date = new Date(value);
      if (short && isMobile()) {
        return new Intl.DateTimeFormat("zh-CN", state.chartHours <= 24
          ? { hour: "2-digit", minute: "2-digit" }
          : { month: "numeric", day: "numeric" }
        ).format(date);
      }
      return new Intl.DateTimeFormat("zh-CN", short
        ? { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }
        : { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }
      ).format(date);
    }

    function formatModel(model) {
      return MODEL_NAMES[model] || model || "--";
    }

    function renderBattery(value) {
      const el = $("#liveBattery");
      if (value == null || Number.isNaN(Number(value))) {
        el.hidden = true;
        el.innerHTML = "";
        return;
      }
      const level = Math.max(0, Math.min(100, Number(value)));
      const fillMax = 15.6;
      const fillWidth = ((fillMax * level) / 100).toFixed(2);
      el.hidden = false;
      el.innerHTML = `
        <svg class="battery-icon" viewBox="0 0 24 12" aria-hidden="true">
          <rect x="0.75" y="1.75" width="19.5" height="8.5" rx="1.5"
                fill="none" stroke="currentColor" stroke-width="1.25"/>
          <rect x="21.25" y="4.25" width="2" height="3.5" rx="0.6" fill="currentColor"/>
          ${level > 0
            ? `<rect x="2.7" y="3.55" width="${fillWidth}" height="4.9" rx="0.5" fill="currentColor"/>`
            : ""}
        </svg>
        <span>${escapeHtml(formatNumber(level, 0))}%</span>`;
    }

    function downsample(items, maxPoints) {
      if (items.length <= maxPoints) return items;
      const sampled = [];
      const step = (items.length - 1) / (maxPoints - 1);
      for (let index = 0; index < maxPoints; index++) {
        sampled.push(items[Math.round(index * step)]);
      }
      return sampled;
    }

    function localInputValue(date) {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 16);
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addDays(date, amount) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount);
    }

    function dayKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDay(date) {
      const prefix = date.getTime() === startOfDay(new Date()).getTime() ? "今天 · " : "";
      return prefix + new Intl.DateTimeFormat("zh-CN", {
        year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
      }).format(date);
    }

    async function getJson(url) {
      const response = await fetch(url, {
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });
      if (!response.ok) {
        throw new Error(`API ${response.status}`);
      }
      return response.json();
    }

    function setStatus() {
      const dot = $("#statusDot");
      dot.classList.toggle("online", state.latestOk && !state.refreshing);
      dot.classList.toggle("refreshing", state.refreshing);
      if (state.refreshing) {
        $("#statusText").textContent = "刷新中";
        return;
      }
      const wait = `${state.secondsLeft}秒后刷新`;
      $("#statusText").textContent = state.latestOk ? wait : `暂时无法连接 · ${wait}`;
    }

    let countdownTimer = 0;

    function scheduleNextPoll() {
      state.secondsLeft = POLL_INTERVAL / 1000;
      setStatus();
      window.clearInterval(countdownTimer);
      countdownTimer = window.setInterval(() => {
        state.secondsLeft -= 1;
        if (state.secondsLeft <= 0) {
          window.clearInterval(countdownTimer);
          pollLatest();
          return;
        }
        setStatus();
      }, 1000);
    }

    async function pollLatest() {
      if (state.refreshing) return;
      state.refreshing = true;
      setStatus();
      try {
        const [temperature, humidity, battery] = await Promise.all([
          getJson(API.latestTemperature),
          getJson(API.latestHumidity).catch(() => null),
          getJson(API.latestBattery).catch(() => null)
        ]);

        $("#liveTemperature").innerHTML =
          `${escapeHtml(formatNumber(temperature.temperature))}<small>°C</small>`;
        $("#temperatureTime").textContent = formatTime(temperature.timestamp);
        $("#liveModel").textContent = formatModel(temperature.model);
        $("#liveAddress").textContent = temperature.address || "--";
        renderBattery(battery?.battery ?? temperature.battery ?? humidity?.battery);

        if (humidity) {
          $("#liveHumidity").innerHTML =
            `${escapeHtml(formatNumber(humidity.humidity, 0))}<small>%</small>`;
          $("#humidityTime").textContent = formatTime(humidity.timestamp);
        }

        state.latestOk = true;
      } catch (error) {
        state.latestOk = false;
        console.error(error);
      } finally {
        state.refreshing = false;
        scheduleNextPoll();
      }
    }

    async function loadRange(hours) {
      const requestId = ++state.chartRequestId;
      setChartLoading(true);
      state.chartView = null;
      state.chartMode = "range";
      state.chartHours = hours;
      $$(".range-buttons button").forEach((button) => {
        button.classList.toggle("active", Boolean(button.dataset.hours)
          && Number(button.dataset.hours) === hours);
      });
      $("#dayNavigation").hidden = true;

      const from = new Date(Date.now() - hours * 3600000).toISOString();
      const url = `${API.readings}&from=${encodeURIComponent(from)}&limit=25000`;

      try {
        const data = await getJson(url);
        if (requestId !== state.chartRequestId) return;
        state.chartItems = data.items
          .filter((item) => item.temperature != null || item.humidity != null)
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        renderChart();
      } catch (error) {
        if (requestId !== state.chartRequestId) return;
        state.chartItems = [];
        renderChart("曲线加载失败");
        console.error(error);
      } finally {
        if (requestId === state.chartRequestId) setChartLoading(false);
      }
    }

    async function loadDay(date) {
      const requestId = ++state.chartRequestId;
      setChartLoading(true);
      state.chartView = null;
      state.chartMode = "day";
      state.chartHours = 24;
      state.selectedDay = startOfDay(date);
      $$(".range-buttons button").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === "day");
      });
      $("#dayNavigation").hidden = false;
      $("#selectedDayLabel").textContent = formatDay(state.selectedDay);
      $("#nextDay").disabled = addDays(state.selectedDay, 1) > new Date();

      const from = state.selectedDay;
      const to = new Date(addDays(from, 1).getTime() - 1);
      const url = `${API.readings}&from=${encodeURIComponent(from.toISOString())}`
        + `&to=${encodeURIComponent(to.toISOString())}&limit=25000`;

      try {
        const data = await getJson(url);
        if (requestId !== state.chartRequestId) return;
        state.chartItems = data.items
          .filter((item) => item.temperature != null || item.humidity != null)
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        renderChart();
      } catch (error) {
        if (requestId !== state.chartRequestId) return;
        state.chartItems = [];
        renderChart("曲线加载失败");
        console.error(error);
      } finally {
        if (requestId === state.chartRequestId) setChartLoading(false);
      }
    }

    function setChartLoading(loading) {
      state.chartLoading = loading;
      if (loading) state.chartError = "";
      $("#chartSurface").setAttribute("aria-busy", String(loading));
      $("#chartLoading").hidden = !loading;
      $("#chartTooltip")?.setAttribute("hidden", "");
      updateZoomButtons();
    }

    const changeMetrics = [
      { field: "temperature", label: "温度", color: "var(--change-temperature)" },
      { field: "humidity", label: "湿度", color: "var(--change-humidity)" },
      { field: "battery", label: "电量", color: "var(--change-battery)" },
      { field: "rssi", label: "信号", color: "var(--signal)" }
    ];

    function readingChanges(items) {
      const previousByDevice = new Map();
      const changes = new Map();
      // Compare before viewport filtering so zooming does not discard the baseline.
      for (const item of items) {
        const previous = previousByDevice.get(item.address) || {};
        const fields = [];
        for (const { field } of changeMetrics) {
          if (item[field] == null || !Number.isFinite(Number(item[field]))) continue;
          const value = Number(item[field]);
          if (previous[field] != null && previous[field] !== value) fields.push(field);
          previous[field] = value;
        }
        previousByDevice.set(item.address, previous);
        changes.set(item, fields);
      }
      return changes;
    }

    function chartBaseDomain() {
      if (state.chartItems.length === 0) return null;
      const start = state.chartMode === "day"
        ? state.selectedDay.getTime()
        : new Date(state.chartItems[0].timestamp).getTime();
      const rawEnd = state.chartMode === "day"
        ? addDays(state.selectedDay, 1).getTime()
        : new Date(state.chartItems.at(-1).timestamp).getTime();
      return { start, end: Math.max(rawEnd, start + 1) };
    }

    function renderChart(errorText = state.chartError) {
      state.chartError = errorText;
      $("#changeLegend").hidden = !state.showChanges;
      $("#signalLegend").hidden = !state.showSignal;
      const wrap = $("#chartWrap");
      const allItems = state.chartItems;
      if (errorText || allItems.length === 0) {
        wrap.innerHTML = `<div class="chart-empty">${escapeHtml(errorText || "暂无温湿度数据")}</div>`;
        $("#chartSummary").textContent = "无可用数据";
        updateZoomButtons();
        return;
      }

      const baseDomain = chartBaseDomain();
      const firstTime = state.chartView?.start ?? baseDomain.start;
      const lastTime = state.chartView?.end ?? baseDomain.end;
      const items = allItems.filter((item) => {
        const time = new Date(item.timestamp).getTime();
        return time >= firstTime && time <= lastTime;
      });
      if (items.length === 0) {
        wrap.innerHTML = '<div class="chart-empty">当前缩放范围暂无数据</div>';
        $("#chartSummary").textContent = "可缩小或重置查看完整曲线";
        updateZoomButtons();
        return;
      }

      if (!$("#chart")) {
        wrap.innerHTML = '<svg id="chart" role="img" aria-label="温湿度历史曲线"></svg>';
      }

      const svg = $("#chart");
      const mobile = isMobile();
      const width = Math.max(wrap.clientWidth || 320, 280);
      const markerHeight = state.showChanges ? 44 : 0;
      const signalHeight = state.showSignal ? (mobile ? 120 : 140) : 0;
      const mainHeight = (mobile ? 220 : 340) + markerHeight;
      const height = mainHeight + signalHeight;
      const padding = mobile
        ? { top: 14, right: 32, bottom: 28, left: 32 }
        : { top: 25, right: 52, bottom: 44, left: 52 };
      padding.top += markerHeight;
      const fontSize = mobile ? 10 : 12;
      const axisOffset = mobile ? 6 : 10;
      const strokeWidth = mobile ? 1.5 : 2;
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = mainHeight - padding.top - padding.bottom;
      const maxPoints = Math.max(Math.floor(plotWidth), 80);
      const temperatureAll = items.filter((item) => item.temperature != null);
      const humidityAll = items.filter((item) => item.humidity != null);
      const temperatureItems = downsample(temperatureAll, maxPoints);
      const humidityItems = downsample(humidityAll, maxPoints);

      const makeScale = (values, minimumMargin) => {
        if (!values.length) return null;
        const rawMin = Math.min(...values);
        const rawMax = Math.max(...values);
        const margin = Math.max((rawMax - rawMin) * .15, minimumMargin);
        return {
          rawMin,
          rawMax,
          min: Math.floor((rawMin - margin) * 2) / 2,
          max: Math.ceil((rawMax + margin) * 2) / 2
        };
      };

      const temperatureScale = makeScale(
        temperatureAll.map((item) => Number(item.temperature)),
        .8
      );
      const humidityScale = makeScale(
        humidityAll.map((item) => Number(item.humidity)),
        3
      );
      const timeSpan = Math.max(lastTime - firstTime, 1);
      const offlineRanges = [];

      for (let index = 1; index < items.length; index++) {
        const previousTime = new Date(items[index - 1].timestamp).getTime();
        const currentTime = new Date(items[index].timestamp).getTime();
        if (currentTime - previousTime > OFFLINE_THRESHOLD) {
          offlineRanges.push({ start: previousTime, end: currentTime });
        }
      }

      const xAtTime = (time) => padding.left
        + ((time - firstTime) / timeSpan) * plotWidth;
      const x = (item) => xAtTime(new Date(item.timestamp).getTime());
      const y = (value, scale) => padding.top
        + (1 - (Number(value) - scale.min) / Math.max(scale.max - scale.min, 1)) * plotHeight;

      const changes = state.showChanges ? readingChanges(allItems) : new Map();
      const markers = state.showChanges ? changeMetrics.map(({ field, label, color }, row) => {
        const changed = items.filter((item) => changes.get(item)?.includes(field));
        const top = 5 + row * 10;
        const path = changed.map((item) => {
          const position = x(item);
          return `M${(position - 3).toFixed(2)},${top}h6l-3,6Z`;
        }).join(" ");
        return `<path class="change-marker" data-field="${field}" data-count="${changed.length}" d="${path}" fill="${color}" fill-opacity=".8"><title>${label}变化 · ${changed.length} 次</title></path>`;
      }).join("") : "";

      const signalItems = items.filter((item) => item.rssi != null && Number.isFinite(Number(item.rssi)));
      const signalScale = state.showSignal ? makeScale(signalItems.map((item) => Number(item.rssi)), 3) : null;
      const signalTop = mainHeight + 5;
      const signalBottom = height - padding.bottom;
      const signalY = (value) => signalTop + (1 - (Number(value) - signalScale.min)
        / (signalScale.max - signalScale.min)) * (signalBottom - signalTop);
      let signalPlot = "";
      if (state.showSignal) {
        signalPlot = `<text x="${padding.left}" y="${signalTop - 12}" fill="var(--signal)" font-size="${fontSize}">信号 dBm</text>`;
        if (signalScale) {
          signalPlot += [0, .5, 1].map((ratio) => {
            const value = signalScale.max - ratio * (signalScale.max - signalScale.min);
            const position = signalY(value);
            return `<line x1="${padding.left}" x2="${width - padding.right}" y1="${position}" y2="${position}" stroke="var(--line)"/>
              <text x="${padding.left - axisOffset}" y="${position + 4}" text-anchor="end" fill="var(--signal)" font-size="${fontSize}">${value.toFixed(0)}</text>`;
          }).join("");
          let previous = null;
          const signalPath = items.map((item) => {
            if (item.rssi == null || !Number.isFinite(Number(item.rssi))) { previous = null; return ""; }
            const connected = previous && previous.address === item.address
              && new Date(item.timestamp) - new Date(previous.timestamp) <= OFFLINE_THRESHOLD;
            previous = item;
            const point = `${x(item).toFixed(2)},${signalY(item.rssi).toFixed(2)}`;
            return connected ? `L${point}` : `M${point}L${point}`;
          }).join(" ");
          signalPlot += `<path id="signalCurve" d="${signalPath}" fill="none" stroke="var(--signal)" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;
        } else {
          signalPlot += `<text x="${padding.left + plotWidth / 2}" y="${(signalTop + signalBottom) / 2}" text-anchor="middle" fill="var(--muted)" font-size="${fontSize}">暂无信号数据</text>`;
        }
      }

      const offlineBlocks = offlineRanges.map((range) => {
        const blockX = xAtTime(range.start);
        const blockWidth = xAtTime(range.end) - blockX;
        return `
          <rect x="${blockX.toFixed(2)}" y="${padding.top}" width="${blockWidth.toFixed(2)}"
                height="${plotHeight}" fill="var(--offline)">
            <title>离线：${escapeHtml(formatTime(range.start))} 至 ${escapeHtml(formatTime(range.end))}</title>
          </rect>`;
      }).join("");

      const grid = Array.from({ length: mobile ? 4 : 5 }, (_, index) => {
        const last = mobile ? 3 : 4;
        const ratio = index / last;
        const gridY = padding.top + ratio * plotHeight;
        const temperatureLabel = temperatureScale
          ? `${(temperatureScale.max - ratio * (temperatureScale.max - temperatureScale.min)).toFixed(mobile ? 0 : 1)}°`
          : "";
        const humidityLabel = humidityScale
          ? `${(humidityScale.max - ratio * (humidityScale.max - humidityScale.min)).toFixed(0)}%`
          : "";
        return `
          <line x1="${padding.left}" y1="${gridY}" x2="${width - padding.right}" y2="${gridY}"
                stroke="#d8d8d8" stroke-width="1"/>
          <text x="${padding.left - axisOffset}" y="${gridY + 4}" text-anchor="end"
                fill="#111" font-size="${fontSize}">${temperatureLabel}</text>
          <text x="${width - padding.right + axisOffset}" y="${gridY + 4}" text-anchor="start"
                fill="#707070" font-size="${fontSize}">${humidityLabel}</text>`;
      }).join("");

      const temperaturePoints = temperatureScale
        ? temperatureItems.map((item) =>
            `${x(item).toFixed(2)},${y(item.temperature, temperatureScale).toFixed(2)}`
          ).join(" ")
        : "";
      const humidityPoints = humidityScale
        ? humidityItems.map((item) =>
            `${x(item).toFixed(2)},${y(item.humidity, humidityScale).toFixed(2)}`
          ).join(" ")
        : "";
      const labelItems = mobile
        ? [{ timestamp: firstTime }, { timestamp: lastTime }]
        : [{ timestamp: firstTime }, { timestamp: firstTime + timeSpan / 2 }, { timestamp: lastTime }];
      const labels = labelItems.map((item, index, list) => `
          <text x="${x(item)}" y="${height - (mobile ? 8 : 12)}"
                text-anchor="${index === 0 ? "start" : index === list.length - 1 ? "end" : "middle"}"
                fill="#707070" font-size="${fontSize}">${escapeHtml(formatTime(item.timestamp, true))}</text>`
      ).join("");

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.setAttribute("aria-label", `温湿度历史曲线${state.showChanges ? "，含数据变化标记" : ""}${state.showSignal ? "，含信号强度曲线" : ""}`);
      svg.innerHTML = `
        ${offlineBlocks}
        ${grid}
        ${markers}
        ${temperaturePoints
          ? `<polyline points="${temperaturePoints}" fill="none" stroke="#111" stroke-width="${strokeWidth}"
                       stroke-linejoin="round" stroke-linecap="round"/>`
          : ""}
        ${humidityPoints
          ? `<polyline points="${humidityPoints}" fill="none" stroke="var(--humidity)" stroke-width="${strokeWidth}"
                       stroke-linejoin="round" stroke-linecap="round"/>`
          : ""}
        ${signalPlot}
        ${labels}
        <g id="chartCursor" visibility="hidden" pointer-events="none">
          <line id="chartCursorLine" y1="${padding.top}" y2="${height - padding.bottom}"
                stroke="#707070" stroke-width="1" stroke-dasharray="3 3"/>
          <circle id="chartTemperatureCursor" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
          <circle id="chartHumidityCursor" r="4" fill="#fff" stroke="#888" stroke-width="2"/>
          <circle id="chartSignalCursor" r="3" fill="#fff" stroke="var(--signal)" stroke-width="2"/>
        </g>`;

      const summaries = [];
      if (temperatureScale) {
        summaries.push(
          `温度 ${formatNumber(temperatureScale.rawMin)}° 至 ${formatNumber(temperatureScale.rawMax)}°`
        );
      }
      if (humidityScale) {
        summaries.push(
          `湿度 ${formatNumber(humidityScale.rawMin, 0)}% 至 ${formatNumber(humidityScale.rawMax, 0)}%`
        );
      }
      if (offlineRanges.length) {
        summaries.push(`离线 ${offlineRanges.length} 段`);
      }
      if (signalScale) summaries.push(`信号 ${formatNumber(signalScale.rawMin)} 至 ${formatNumber(signalScale.rawMax)} dBm`);
      if (state.chartView) {
        summaries.push("已缩放");
      }
      $("#chartSummary").textContent = summaries.join(mobile ? " · " : "　");

      $("#chartTooltip")?.remove();
      wrap.insertAdjacentHTML("beforeend", `
        <div id="chartTooltip" class="chart-tooltip" role="status" aria-live="polite" hidden></div>`);
      setupChartInteraction({
        svg, wrap, tooltip: $("#chartTooltip"), items, width, padding, plotWidth,
        firstTime, lastTime, temperatureScale, humidityScale, signalScale, signalY, changes, xAtTime, y
      });
      updateZoomButtons();
    }

    function updateZoomButtons() {
      const base = chartBaseDomain();
      const currentSpan = base
        ? (state.chartView?.end ?? base.end) - (state.chartView?.start ?? base.start)
        : 0;
      const minimumSpan = base ? Math.min(15 * 60 * 1000, base.end - base.start) : 0;
      $("#chartZoomIn").disabled = state.chartLoading || !base || currentSpan <= minimumSpan + 1;
      $("#chartZoomOut").disabled = state.chartLoading || !state.chartView;
      $("#chartZoomReset").disabled = state.chartLoading || !state.chartView;
    }

    function setChartSpan(targetSpan, anchorRatio = .5, sourceDomain = null) {
      const base = chartBaseDomain();
      if (!base) return;
      const baseSpan = base.end - base.start;
      const minimumSpan = Math.min(15 * 60 * 1000, baseSpan);
      const span = Math.max(minimumSpan, Math.min(baseSpan, targetSpan));
      const current = sourceDomain || state.chartView || base;
      const ratio = Math.max(0, Math.min(1, anchorRatio));
      const anchorTime = current.start + (current.end - current.start) * ratio;
      let start = anchorTime - span * ratio;
      start = Math.max(base.start, Math.min(start, base.end - span));
      state.chartView = span >= baseSpan - 1 ? null : { start, end: start + span };
      renderChart();
    }

    function zoomChart(factor, anchorRatio = .5) {
      const base = chartBaseDomain();
      if (!base) return;
      const current = state.chartView || base;
      setChartSpan((current.end - current.start) * factor, anchorRatio, current);
    }

    function nearestItem(items, targetTime) {
      let low = 0;
      let high = items.length - 1;
      while (low < high) {
        const middle = Math.floor((low + high) / 2);
        if (new Date(items[middle].timestamp).getTime() < targetTime) {
          low = middle + 1;
        } else {
          high = middle;
        }
      }
      const current = items[low];
      const previous = items[Math.max(0, low - 1)];
      return Math.abs(new Date(previous.timestamp).getTime() - targetTime)
        <= Math.abs(new Date(current.timestamp).getTime() - targetTime)
        ? previous
        : current;
    }

    function setupChartInteraction(context) {
      const { svg, wrap, tooltip, items, width, padding, plotWidth,
        firstTime, lastTime, temperatureScale, humidityScale, signalScale, signalY, changes, xAtTime, y } = context;
      const cursor = $("#chartCursor");
      const cursorLine = $("#chartCursorLine");
      const temperatureCursor = $("#chartTemperatureCursor");
      const humidityCursor = $("#chartHumidityCursor");
      const signalCursor = $("#chartSignalCursor");

      const showAt = (clientX) => {
        if (state.chartLoading) return;
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;
        const svgX = ((clientX - rect.left) / rect.width) * width;
        if (svgX < padding.left || svgX > width - padding.right) {
          cursor.setAttribute("visibility", "hidden");
          tooltip.hidden = true;
          return;
        }
        const ratio = (svgX - padding.left) / plotWidth;
        const item = nearestItem(items, firstTime + (lastTime - firstTime) * ratio);
        const itemX = xAtTime(new Date(item.timestamp).getTime());
        cursor.setAttribute("visibility", "visible");
        cursorLine.setAttribute("x1", itemX);
        cursorLine.setAttribute("x2", itemX);

        const setPoint = (element, value, scale) => {
          if (value == null || !scale) {
            element.style.display = "none";
            return;
          }
          element.style.display = "";
          element.setAttribute("cx", itemX);
          element.setAttribute("cy", y(value, scale));
        };
        setPoint(temperatureCursor, item.temperature, temperatureScale);
        setPoint(humidityCursor, item.humidity, humidityScale);
        signalCursor.style.display = signalScale && item.rssi != null ? "" : "none";
        if (signalScale && item.rssi != null) {
          signalCursor.setAttribute("cx", itemX);
          signalCursor.setAttribute("cy", signalY(item.rssi));
        }

        tooltip.innerHTML = `
          <strong>${escapeHtml(formatTime(item.timestamp))}</strong>
          <span class="temperature-value">温度 ${escapeHtml(formatNumber(item.temperature))} °C</span>
          <span>湿度 ${escapeHtml(formatNumber(item.humidity, 0))} %</span>
          ${state.showSignal ? `<span>信号 ${escapeHtml(formatNumber(item.rssi))} dBm</span>` : ""}
          ${state.showChanges ? `<span>变化：${changeMetrics.filter(({ field }) => changes.get(item)?.includes(field)).map(({ label }) => label).join("、") || "无已知变化"}</span>
            ${changes.get(item)?.includes("battery") ? `<span>电量 ${escapeHtml(formatNumber(item.battery))} %</span>` : ""}` : ""}`;
        const wrapRect = wrap.getBoundingClientRect();
        const localX = clientX - wrapRect.left;
        tooltip.classList.toggle("align-left", localX > wrapRect.width * .65);
        tooltip.style.left = `${localX + (localX > wrapRect.width * .65 ? -12 : 12)}px`;
        tooltip.hidden = false;
      };

      svg.onpointerdown = (event) => showAt(event.clientX);
      svg.onpointermove = (event) => showAt(event.clientX);
      svg.onpointerleave = (event) => {
        if (event.pointerType === "touch") return;
        cursor.setAttribute("visibility", "hidden");
        tooltip.hidden = true;
      };
      svg.onwheel = (event) => {
        event.preventDefault();
        const rect = svg.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1,
          (event.clientX - rect.left - (padding.left / width) * rect.width)
          / ((plotWidth / width) * rect.width)
        ));
        zoomChart(event.deltaY < 0 ? .75 : 1.35, ratio);
      };

      let pinch = null;
      svg.ontouchstart = (event) => {
        if (event.touches.length !== 2) return;
        event.preventDefault();
        const distance = Math.abs(event.touches[1].clientX - event.touches[0].clientX);
        const rect = svg.getBoundingClientRect();
        const centerX = (event.touches[0].clientX + event.touches[1].clientX) / 2;
        pinch = {
          distance: Math.max(distance, 1),
          lastDistance: Math.max(distance, 1),
          domain: state.chartView || chartBaseDomain(),
          anchorRatio: Math.max(0, Math.min(1,
            (centerX - rect.left - (padding.left / width) * rect.width)
            / Math.max((plotWidth / width) * rect.width, 1)
          ))
        };
      };
      svg.ontouchmove = (event) => {
        if (!pinch || event.touches.length !== 2) return;
        event.preventDefault();
        pinch.lastDistance = Math.max(Math.abs(event.touches[1].clientX - event.touches[0].clientX), 1);
      };
      svg.ontouchend = () => {
        if (!pinch) return;
        const domain = pinch.domain;
        setChartSpan((domain.end - domain.start) * pinch.distance / pinch.lastDistance,
          pinch.anchorRatio, domain);
        pinch = null;
      };
    }

    function metricStats(items, field, stats) {
      if (!stats?.duration) return null;
      const values = items.filter((item) => item[field] != null && Number.isFinite(Number(item[field])));
      const min = stats.minimum;
      const max = stats.maximum;
      const span = Math.max(max - min, 1);
      const start = stats.start;
      const daySpan = addDays(new Date(start), 1).getTime() - start;
      const points = downsample(values, 70).map((item) => {
        const x = ((new Date(item.timestamp).getTime() - start) / daySpan) * 100;
        const y = 25 - ((Number(item[field]) - min) / span) * 22;
        return `${Math.max(0, Math.min(100, x)).toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return {
        min,
        max,
        average: stats.average,
        coverage: TimeWeighted.coverage(stats, stats.span, state.calendarDevices),
        points: values.length > 1 ? points : ""
      };
    }

    function sparkline(items, stats) {
      const showTemperature = state.calendarMetric !== "humidity";
      const showHumidity = state.calendarMetric !== "temperature";
      const temperature = showTemperature ? metricStats(items, "temperature", stats.temperature) : null;
      const humidity = showHumidity ? metricStats(items, "humidity", stats.humidity) : null;
      if (!temperature && !humidity) return stats.temperature || stats.humidity
        ? '<span class="calendar-day-reading" title="未知 · 无有效时长">--</span>' : "";

      const lines = [
        temperature?.points
          ? `<polyline data-metric="temperature" points="${temperature.points}" fill="none" stroke="#111"
                       stroke-width="1.5" vector-effect="non-scaling-stroke"/>`
          : "",
        humidity?.points
          ? `<polyline data-metric="humidity" points="${humidity.points}" fill="none" stroke="#888"
                       stroke-width="1.5" vector-effect="non-scaling-stroke"/>`
          : ""
      ].join("");
      const chart = lines
        ? `<svg class="calendar-sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>`
        : "";
      const readings = [
        showTemperature ? `<span title="平均温度 · 有效覆盖 ${(temperature?.coverage ?? 0).toFixed(0)}%">${formatNumber(temperature?.average)}°C</span>` : "",
        showHumidity ? `<span title="平均湿度 · 有效覆盖 ${(humidity?.coverage ?? 0).toFixed(0)}%">${formatNumber(humidity?.average, 0)}%</span>` : ""
      ].join("");
      const ranges = [
        temperature ? `<span>${formatNumber(temperature.min)}°–${formatNumber(temperature.max)}°</span>` : "",
        humidity ? `<span>${formatNumber(humidity.min, 0)}%–${formatNumber(humidity.max, 0)}%</span>` : ""
      ].join("");
      return `<span class="calendar-day-reading">${readings}</span>
        ${chart}<span class="calendar-day-range">${ranges}</span>`;
    }

    async function loadCalendar() {
      const requestId = ++state.calendarRequestId;
      const monthStart = state.calendarMonth;
      const monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 1);
      const to = Math.min(monthEnd.getTime(), Date.now());
      const queryFrom = new Date(monthStart.getTime() - TimeWeighted.VALID_FOR_MS);
      $("#calendarMonthTitle").textContent = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric", month: "long"
      }).format(monthStart);
      $("#nextMonth").disabled = monthEnd > new Date();
      $("#calendarGrid").innerHTML = '<div class="calendar-loading">加载中</div>';

      try {
        const url = `${API.readings}&from=${encodeURIComponent(queryFrom.toISOString())}`
          + `&to=${encodeURIComponent(new Date(to).toISOString())}&limit=25000`;
        const data = await getJson(url);
        if (requestId !== state.calendarRequestId) return;
        const sourceItems = data.items
          .filter((item) => item.temperature != null || item.humidity != null);
        state.calendarItems = sourceItems.filter((item) => new Date(item.timestamp).getTime() >= monthStart.getTime()
          && new Date(item.timestamp).getTime() < to);
        state.calendarDevices = new Set(sourceItems.map((item) => item.address)).size;
        for (const field of ["temperature", "humidity"]) {
          const intervals = TimeWeighted.segments(sourceItems, field, monthStart.getTime(), to);
          state.calendarStats[field] = new Map(TimeWeighted.buckets(intervals, monthStart.getTime(), to, "day")
            .map((group) => [dayKey(new Date(group.start)), group]));
        }
        if (data.items.length >= 25000) $("#calendarMonthTitle").textContent += " · 数据可能不完整";
        renderCalendar();
      } catch (error) {
        if (requestId !== state.calendarRequestId) return;
        $("#calendarGrid").innerHTML = '<div class="calendar-loading">日历数据加载失败</div>';
        console.error(error);
      }
    }

    function renderCalendar() {
      const monthStart = state.calendarMonth;
      const mondayOffset = (monthStart.getDay() + 6) % 7;
      const gridStart = addDays(monthStart, -mondayOffset);
      const today = startOfDay(new Date());
      const byDay = state.calendarItems.reduce((groups, item) => {
        const key = dayKey(new Date(item.timestamp));
        (groups[key] ||= []).push(item);
        return groups;
      }, {});

      $("#calendarGrid").innerHTML = Array.from({ length: 42 }, (_, index) => {
        const date = addDays(gridStart, index);
        const key = dayKey(date);
        const outside = date.getMonth() !== monthStart.getMonth();
        const future = date > today;
        const selected = key === dayKey(state.selectedDay);
        const classes = ["calendar-day", outside && "outside", future && "future",
          selected && "selected", date.getTime() === today.getTime() && "today"]
          .filter(Boolean).join(" ");
        const items = (byDay[key] || [])
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        return `<button type="button" class="${classes}" data-date="${key}" ${future ? "disabled" : ""}
                  aria-label="查看 ${key} 温湿度曲线">
          <span class="calendar-day-number">${date.getDate()}</span>
          ${sparkline(items, { temperature: state.calendarStats.temperature.get(key), humidity: state.calendarStats.humidity.get(key) })}
        </button>`;
      }).join("");
    }

    function openCalendar() {
      state.calendarMonth = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), 1);
      $("#calendarDialog").showModal();
      document.body.style.overflow = "hidden";
      loadCalendar();
    }

    function closeCalendar() {
      $("#calendarDialog").close();
      document.body.style.overflow = "";
    }

    async function loadHistory(event) {
      event?.preventDefault();
      const button = $("#queryButton");
      button.disabled = true;
      $("#historyMessage").hidden = false;
      $("#historyMessage").textContent = "加载中";

      const params = new URLSearchParams({ limit: "500" });
      const from = $("#fromTime").value;
      const to = $("#toTime").value;
      if (from) params.set("from", new Date(from).toISOString());
      if (to) params.set("to", new Date(to).toISOString());

      try {
        const data = await getJson(`${API.readings}&${params}`);
        renderHistory(data.items);
      } catch (error) {
        $("#historyBody").innerHTML = "";
        $("#historyMessage").hidden = false;
        $("#historyMessage").textContent = "历史数据加载失败";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    }

    function renderHistory(items) {
      $("#historyToggle").textContent = `收起 · ${items.length} 条`;
      $("#historyMessage").hidden = items.length > 0;
      $("#historyMessage").textContent = items.length ? "" : "该时段暂无数据";
      $("#historyBody").innerHTML = items.map((item) => `
        <tr>
          <td>${escapeHtml(formatTime(item.timestamp))}</td>
          <td>${escapeHtml(formatNumber(item.temperature))} °C</td>
          <td>${escapeHtml(formatNumber(item.humidity, 0))} %</td>
          <td>${escapeHtml(formatNumber(item.battery, 0))} %</td>
          <td>${escapeHtml(formatNumber(item.rssi, 0))} dBm</td>
        </tr>
      `).join("");
    }

    function initializeDates() {
      const now = new Date();
      $("#toTime").value = localInputValue(now);
      $("#fromTime").value = localInputValue(new Date(now.getTime() - 24 * 3600000));
    }

    function toggleHistory() {
      state.historyOpen = !state.historyOpen;
      $("#historyPanel").hidden = !state.historyOpen;
      $("#historyToggle").textContent = state.historyOpen ? "收起" : "查看";
      if (state.historyOpen) {
        loadHistory();
      }
    }

    $$(".range-buttons button").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.mode === "day") {
          loadDay(state.selectedDay);
        } else {
          loadRange(Number(button.dataset.hours));
        }
      });
    });
    $("#previousDay").addEventListener("click", () => loadDay(addDays(state.selectedDay, -1)));
    for (const field of ["showChanges", "showSignal"]) {
      $(`#${field}`).addEventListener("change", (event) => {
        state[field] = event.target.checked;
        renderChart();
      });
    }
    $("#nextDay").addEventListener("click", () => loadDay(addDays(state.selectedDay, 1)));
    $("#chartZoomIn").addEventListener("click", () => zoomChart(.5));
    $("#chartZoomOut").addEventListener("click", () => zoomChart(2));
    $("#chartZoomReset").addEventListener("click", () => {
      state.chartView = null;
      renderChart();
    });
    $("#calendarOpen").addEventListener("click", openCalendar);
    $("#calendarClose").addEventListener("click", closeCalendar);
    $("#previousMonth").addEventListener("click", () => {
      state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() - 1, 1);
      loadCalendar();
    });
    $("#nextMonth").addEventListener("click", () => {
      state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + 1, 1);
      loadCalendar();
    });
    $$('[data-calendar-metric]').forEach((button) => {
      button.addEventListener("click", () => {
        state.calendarMetric = button.dataset.calendarMetric;
        $$('[data-calendar-metric]').forEach((item) => {
          item.classList.toggle("active", item === button);
          item.setAttribute("aria-pressed", String(item === button));
        });
        renderCalendar();
      });
    });
    $("#calendarGrid").addEventListener("click", (event) => {
      const button = event.target.closest("[data-date]");
      if (!button || button.disabled) return;
      const [year, month, day] = button.dataset.date.split("-").map(Number);
      closeCalendar();
      loadDay(new Date(year, month - 1, day));
    });
    $("#calendarDialog").addEventListener("close", () => {
      document.body.style.overflow = "";
    });
    $("#historyToggle").addEventListener("click", toggleHistory);
    $("#historyForm").addEventListener("submit", loadHistory);

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        if (state.chartItems.length) renderChart();
      }, 120);
    });

    initializeDates();
    pollLatest();
    loadRange(24);
  </script>
</body>
</html>
